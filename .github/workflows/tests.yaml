name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ha-compat:
    name: HA ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    # A beta that breaks us is an early warning, not a reason to block a merge.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Home Assistant
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.channel }}" = "beta" ]; then
            pip install --pre homeassistant
          else
            pip install homeassistant
          fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      # Home Assistant installs integration requirements under its own
      # package_constraints.txt. Resolving the manifest against it here is what
      # catches a pin like protobuf==6.32.0 before a user's restart does (#928).
      - name: Install integration requirements under HA's constraints
        run: |
          constraints=$(python -c "import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / 'package_constraints.txt')")
          python -c "import json; print('\n'.join(json.load(open('custom_components/ecoflow_cloud/manifest.json'))['requirements']))" > requirements.txt
          cat requirements.txt
          pip install -c "$constraints" -r requirements.txt
          pip install pytest

      - name: Import every module
        run: |
          python - <<'EOF'
          import importlib, pkgutil, sys
          import custom_components.ecoflow_cloud as pkg

          failed = []
          for mod in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
              try:
                  importlib.import_module(mod.name)
              except Exception as e:
                  failed.append(f"{mod.name}: {type(e).__name__}: {e}")
          print("\n".join(failed) or "all modules imported")
          sys.exit(1 if failed else 0)
          EOF

      - name: Pytest
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "no tests directory yet"
          fi
